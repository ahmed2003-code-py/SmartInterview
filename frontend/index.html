<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="description" content="Practice realistic teaching interviews by voice in Arabic or English, with AI follow-up questions and a detailed feedback report." />
    <title>SmartInterview · AI Interview Simulator</title>
    <script>
      // Apply saved theme and language before first paint to avoid a flash.
      (function () {
        try {
          var theme = localStorage.getItem('theme') || 'system';
          var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          var lang = localStorage.getItem('lang');
          if (lang === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
